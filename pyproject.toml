[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dinner-picker"
version = "0.1.0"
description = "A small FastAPI app that picks a dinner idea from home-cooked recipes and takeout menu items."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "python-multipart",
  "alembic>=1.19.2",
  "sqlmodel>=0.0.42",
  "psycopg2-binary",
  "authlib>=1.8.0",
  "httpx2>=2.12.0",
  "itsdangerous>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dinner_picker"]

[tool.vercel]
entrypoint = "src.dinner_picker:app"

[tool.alembic]
script_location = "alembic"
prepend_sys_path = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
